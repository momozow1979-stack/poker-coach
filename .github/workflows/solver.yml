name: Solver CI

# CFR ソルバー(solver/、Python + Rust)のテスト。
# solver/ が変わった時だけ走らせる（アプリやドキュメントだけの変更で、
# 22分ほどかかるこのジョブを毎回待たされないように）。
on:
  push:
    branches: ['**']
    paths:
      - 'solver/**'
      - '.github/workflows/solver.yml'
  pull_request:
    paths:
      - 'solver/**'
      - '.github/workflows/solver.yml'

jobs:
  solver-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solver
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: solver/native -> target

      - name: Install solver package
        run: pip install -e ".[dev]"

      - name: Run solver tests
        run: pytest -v
