name: Deploy web preview

# 実機がなくても動作を確認できるように、Flutter Web ビルドを
# GitHub Pages へ公開する。公開先は公開リポジトリと同じく誰でも閲覧できる。
#
# 前提となるリポジトリ設定:
#   Settings → Pages → Build and deployment → Source を "GitHub Actions" にする。
#   Actions のトークンでは Pages サイトを新規作成できないため、この操作は手動。
#   未設定のうちはデプロイを飛ばし、ビルド成果物だけを artifact として残す。
#
# 公開はデフォルトブランチからのみ行う。
# GitHub が自動生成する github-pages 環境は、既定でデフォルトブランチ以外からの
# デプロイを拒否する（deploy ジョブが即座に失敗する）ため。
# 機能ブランチからもプレビューしたい場合は
#   Settings → Environments → github-pages → Deployment branches and tags
# に該当ブランチを追加したうえで、下の deploy ジョブの if を緩める。
on:
  push:
    branches:
      - main
      - claude/poker-coaching-app-0p1ya7
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_ready: ${{ steps.configure.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # CanvasKit を同梱して CDN 依存を減らす。
      # base-href は Pages の配信パス (/<repo>/) に合わせる。
      #
      # --pwa-strategy=none で Service Worker を無効にする。
      # 既定の Service Worker はアプリをキャッシュするため、デプロイ後に
      # リロードしても古い画面が出てしまう（1 回目は旧版、2 回目でようやく新版）。
      # 常に最新を見せたいプレビュー用途では邪魔になる。
      #
      # SUPABASE_* はビルド時に --dart-define で埋め込む。
      # publishable key はクライアントに載せる前提の公開鍵で、保護は RLS で行う
      # （秘密鍵 sb_secret_… は絶対にここへ置かないこと）。
      # 別プロジェクトを指したいときは
      #   Settings → Secrets and variables → Actions → Variables
      # に SUPABASE_URL / SUPABASE_PUBLISHABLE_KEY を作れば上書きされる。
      - name: Build web
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://rfxcovghfifmagnbjayl.supabase.co' }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_CzNFlmiqxeZU5XLxsU285A_fF7-5bJ3' }}
        run: |
          flutter build web --release \
            --no-web-resources-cdn \
            --pwa-strategy=none \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --base-href "/${GITHUB_REPOSITORY#*/}/"

      # Pages が未設定でも成果物を取り出せるようにしておく。
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
          retention-days: 14

      # Pages 未設定なら失敗させず、案内だけ出してデプロイを飛ばす。
      - id: configure
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Pages が未設定
        if: steps.configure.outcome != 'success'
        run: |
          echo "::warning::GitHub Pages が有効になっていません。" \
               "Settings → Pages → Source を 'GitHub Actions' にすると、" \
               "次回の push から自動で公開されます。"

      - name: デフォルトブランチ以外のため公開はスキップ
        if: github.ref_name != github.event.repository.default_branch
        run: |
          echo "::notice::${{ github.ref_name }} はデフォルトブランチではないため公開しません。" \
               "ビルド結果は artifact 'web-build' から取得できます。"

      - uses: actions/upload-pages-artifact@v3
        if: steps.configure.outcome == 'success'
        with:
          path: build/web

  deploy:
    needs: build
    if: >-
      needs.build.outputs.pages_ready == 'true' &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
