[project]
name = "cfr-solver"
version = "0.1.0"
description = "Generic CFR/CFR+ solver for extensive-form games (poker subgame solving)."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "native/Cargo.toml"
module-name = "cfr_solver._native"
python-source = "."

[tool.pytest.ini_options]
# solver/vendor/ (gitignored — e.g. a local TexasSolver checkout used for
# cross-validation, see BENCHMARKS.md) must never be picked up by test
# collection even when it exists locally.
testpaths = ["tests"]
