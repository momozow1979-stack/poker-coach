[project]
name = "cfr-solver"
version = "0.1.0"
description = "Generic CFR/CFR+ solver for extensive-form games (poker subgame solving)."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cfr_solver*"]

[tool.pytest.ini_options]
# solver/vendor/ (gitignored — e.g. a local TexasSolver checkout used for
# cross-validation, see BENCHMARKS.md) must never be picked up by test
# collection even when it exists locally.
testpaths = ["tests"]
